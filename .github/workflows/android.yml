name: Build Android APKs

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt apksigner zipalign android-sdk-platform-23 dalvik-exchange imagemagick

      - name: Build APKs
        run: VERSION_CODE=${{ github.run_number }} VERSION_NAME=1.0.${{ github.run_number }} ./android/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pet-arena-apks
          path: apk/*.apk

      - name: Publish release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
